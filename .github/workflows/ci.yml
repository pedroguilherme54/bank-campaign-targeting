name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-e-testes:
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar o uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Instalar dependências
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Testes (pytest)
        run: uv run pytest
