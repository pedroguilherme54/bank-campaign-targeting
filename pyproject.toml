[project]
name = "bank-marketing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pedroguilherme54", email = "pedroguilherme54@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
]

[project.scripts]
bank-marketing = "bank_marketing:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
